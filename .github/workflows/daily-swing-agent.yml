# ① SCHEDULE — two runs every trading day, scan starts at an exact IST time.
#
# GitHub's scheduler often starts jobs 5–20 min late, so each cron fires EARLY. The job installs,
# tests, and PREFETCHES the full price history while it waits; at the exact time it only fetches
# the latest candles, so the report is out within a minute or two.
#   10:30:00 IST  morning   → setups from yesterday's close + live status of each setup today
#   14:45:00 IST  afternoon → PROVISIONAL scan on today's candle (volume projected to full day)
name: Daily Swing Trade Agent

on:
  schedule:
    - cron: "40 4 * * 1-5"       # 10:10 IST → prefetch → wait → scan starts 10:30:00 IST
    - cron: "55 8 * * 1-5"       # 14:25 IST → prefetch → wait → scan starts 14:45:00 IST
  workflow_dispatch:
    inputs:
      session:
        description: "Run type"
        type: choice
        options: [auto, morning, afternoon, eod]
        default: auto
      universe:
        description: "Universe override (blank = config): static | nifty50 | nifty100 | nifty200 | nifty500 | full_nse"
        required: false
        default: ""

concurrency:
  group: swing-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve run settings
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SESSION: ${{ github.event.inputs.session }}
          INPUT_UNIVERSE: ${{ github.event.inputs.universe }}
        run: |
          case "$EVENT_SCHEDULE" in
            "40 4 * * 1-5") TARGET="10:30"; SESSION="morning" ;;
            "55 8 * * 1-5") TARGET="14:45"; SESSION="afternoon" ;;
            *)              TARGET="";      SESSION="${INPUT_SESSION:-auto}" ;;
          esac
          case "$SESSION" in auto|morning|afternoon|eod) ;; *) echo "Invalid session: $SESSION"; exit 1 ;; esac
          UARG=""
          case "$INPUT_UNIVERSE" in
            static|nifty50|nifty100|nifty200|nifty500|full_nse) UARG="--universe $INPUT_UNIVERSE" ;;
            "") ;;
            *) echo "Invalid universe: $INPUT_UNIVERSE"; exit 1 ;;
          esac
          { echo "SESSION=$SESSION"; echo "TARGET=$TARGET"; echo "UARG=$UARG"; } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (offline)
        run: pytest -q

      - name: Prefetch price history (before the start time)
        continue-on-error: true      # if this fails, the scan simply downloads everything itself
        run: python -m src.main prefetch $UARG

      - name: Wait for the exact IST start time
        run: |
          if [ -n "$TARGET" ]; then
            now=$(date +%s)
            tgt=$(TZ=Asia/Kolkata date -d "today $TARGET" +%s)
            if [ "$tgt" -gt "$now" ]; then
              echo "Waiting $((tgt - now))s → scan starts at $TARGET:00 IST"
              sleep $((tgt - now))
            else
              echo "::warning::Scan starting $(( (now - tgt) / 60 )) min after $TARGET IST (GitHub started the job late)"
            fi
          fi
          echo "Scan starting $(TZ=Asia/Kolkata date '+%H:%M:%S') IST (session: $SESSION)"

      - name: Run agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python -m src.main scan --session $SESSION $UARG

      - name: Upload reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: swing-report-${{ github.run_number }}-${{ env.SESSION }}
          path: data/output/swing_agent.*
          retention-days: 30

      - name: Commit reports
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/output
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "report: $SESSION run $(date '+%F %H:%M') IST"
          git pull --rebase --autostash
          git push
