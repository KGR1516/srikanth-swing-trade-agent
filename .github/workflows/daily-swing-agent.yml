# ① SCHEDULE — runs the full pipeline after NSE close and commits the reports.
name: Daily Swing Trade Agent

on:
  schedule:
    - cron: "30 11 * * 1-5"      # 17:00 IST Mon–Fri (NSE closes 15:30; EOD data settled)
  workflow_dispatch:
    inputs:
      universe:
        description: "Universe override (blank = config): static | nifty50 | nifty100 | nifty200 | nifty500 | full_nse"
        required: false
        default: ""

concurrency:
  group: swing-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (offline)
        run: pytest -q

      - name: Run agent
        env:
          UNIVERSE: ${{ github.event.inputs.universe }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          ARGS=""
          case "$UNIVERSE" in
            static|nifty50|nifty100|nifty200|nifty500|full_nse) ARGS="--universe $UNIVERSE" ;;
            "") ;;
            *) echo "Invalid universe: $UNIVERSE"; exit 1 ;;
          esac
          python -m src.main scan $ARGS

      - name: Upload reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: swing-report-${{ github.run_number }}
          path: data/output/swing_agent.*
          retention-days: 30

      - name: Commit reports
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/output
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "report: swing setups $(date +%F)"
          git pull --rebase --autostash
          git push
