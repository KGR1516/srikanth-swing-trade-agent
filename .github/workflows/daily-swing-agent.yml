# ① SCHEDULE — two runs every trading day, started at an exact IST time.
#
# GitHub's scheduler often starts jobs 5–20 min late, so each cron fires 20 minutes EARLY;
# the job installs, runs the tests, then waits until the exact target time before scanning.
#   10:30:00 IST  morning   → setups from yesterday's close + live status of each setup today
#   14:45:00 IST  afternoon → PROVISIONAL scan on today's candle (volume projected to full day)
name: Daily Swing Trade Agent

on:
  schedule:
    - cron: "40 4 * * 1-5"       # 10:10 IST → waits → scan starts 10:30:00 IST
    - cron: "55 8 * * 1-5"       # 14:25 IST → waits → scan starts 14:45:00 IST
  workflow_dispatch:
    inputs:
      session:
        description: "Run type"
        type: choice
        options: [auto, morning, afternoon, eod]
        default: auto
      universe:
        description: "Universe override (blank = config): static | nifty50 | nifty100 | nifty200 | nifty500 | full_nse"
        required: false
        default: ""

concurrency:
  group: swing-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (offline)
        run: pytest -q

      - name: Wait for the exact IST start time
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SESSION: ${{ github.event.inputs.session }}
        run: |
          case "$EVENT_SCHEDULE" in
            "40 4 * * 1-5") TARGET="10:30"; SESSION="morning" ;;
            "55 8 * * 1-5") TARGET="14:45"; SESSION="afternoon" ;;
            *)              TARGET="";      SESSION="${INPUT_SESSION:-auto}" ;;
          esac
          case "$SESSION" in auto|morning|afternoon|eod) ;; *) echo "Invalid session: $SESSION"; exit 1 ;; esac
          echo "SESSION=$SESSION" >> "$GITHUB_ENV"
          if [ -n "$TARGET" ]; then
            now=$(date +%s)
            tgt=$(TZ=Asia/Kolkata date -d "today $TARGET" +%s)
            if [ "$tgt" -gt "$now" ]; then
              echo "Waiting $((tgt - now))s → scan starts at $TARGET:00 IST"
              sleep $((tgt - now))
            else
              echo "::warning::GitHub started this job $(( (now - tgt) / 60 )) min after $TARGET IST — running immediately"
            fi
          fi
          echo "Scan starting $(TZ=Asia/Kolkata date '+%H:%M:%S') IST (session: $SESSION)"

      - name: Run agent
        env:
          UNIVERSE: ${{ github.event.inputs.universe }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          ARGS="--session $SESSION"
          case "$UNIVERSE" in
            static|nifty50|nifty100|nifty200|nifty500|full_nse) ARGS="$ARGS --universe $UNIVERSE" ;;
            "") ;;
            *) echo "Invalid universe: $UNIVERSE"; exit 1 ;;
          esac
          python -m src.main scan $ARGS

      - name: Upload reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: swing-report-${{ github.run_number }}-${{ env.SESSION }}
          path: data/output/swing_agent.*
          retention-days: 30

      - name: Commit reports
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/output
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "report: $SESSION run $(date '+%F %H:%M') IST"
          git pull --rebase --autostash
          git push
