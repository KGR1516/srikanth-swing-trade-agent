# ─────────────────────────────────────────────────────────────
# Stock universe
#   source: "static"   → use the symbols below
#           "nifty50" / "nifty100" / "nifty200" / "nifty500" → live NSE index list
#           "full_nse" → every EQ-series stock listed on NSE (~2,000; slow)
#   Live lists fall back to the static list if NSE is unreachable.
#   If watchlist_file has any symbols, it overrides everything (stock-2 behaviour).
# Symbols are NSE tickers without the ".NS" suffix.
# ─────────────────────────────────────────────────────────────

source: nifty500
exchange_suffix: ".NS"
